<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabins</title>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem; color: #1b1f24; }
nav a { margin-right: 1rem; color: #0b5fff; text-decoration: none; }
table { border-collapse: collapse; margin-top: 1rem; }
th, td { border: 1px solid #d0d7de; padding: 0.4rem 0.75rem; text-align: left; }
th { background: #f6f8fa; }
</style>
</head>
<body>
<nav><a href="/cabins">Cabins</a><a href="/env">Environment</a><a href="/patrols">Patrols</a><a href="/alarms">Alarms</a></nav>
<h1>Cabins</h1>
<p>Registered cabins with their zone, door and inlet valve state.</p>
<table>
<thead><tr><th>ID</th><th>Name</th><th>Zone</th><th>Door</th><th>Valve</th><th>Retired</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<script>
async function load() {
  const response = await fetch("/api/cabins");
  const data = await response.json();
  document.getElementById("rows").innerHTML = data.items.map((cabin) =>
    `<tr><td>${cabin.id}</td><td>${cabin.name}</td><td>${cabin.zone}</td>` +
    `<td>${cabin.door_open ? "open" : "sealed"}</td>` +
    `<td>${cabin.valve_open ? "open" : "closed"}</td>` +
    `<td>${cabin.retired}</td></tr>`).join("");
}
load();
</script>
</body>
</html>
