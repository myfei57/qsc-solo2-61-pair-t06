<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patrols</title>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem; color: #1b1f24; }
nav a { margin-right: 1rem; color: #0b5fff; text-decoration: none; }
ul { line-height: 1.7; }
</style>
</head>
<body>
<nav><a href="/cabins">Cabins</a><a href="/env">Environment</a><a href="/patrols">Patrols</a><a href="/alarms">Alarms</a></nav>
<h1>Patrols</h1>
<p>Route positions together with the cabins that were visited or missed.</p>
<p id="progress"></p>
<ul id="route"></ul>
<ul id="missed"></ul>
<script>
async function load() {
  const response = await fetch("/api/patrols");
  const data = await response.json();
  document.getElementById("progress").textContent =
    `Route length ${data.route_ids.length}, checked ${data.checked_ids.length}`;
  document.getElementById("route").innerHTML =
    data.route.map((item) => `<li>${item.order}. ${item.cabin_id}</li>`).join("");
  document.getElementById("missed").innerHTML =
    data.missed.map((cabin) => `<li>missed: ${cabin}</li>`).join("");
}
load();
</script>
</body>
</html>
