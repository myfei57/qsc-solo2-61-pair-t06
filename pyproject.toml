[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "line-control-service"
version = "1.0.0"
description = "line service"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tunnelnet = "tunnelnet.cli:main"

[tool.setuptools.packages.find]
include = ["tunnelnet*"]

[tool.setuptools]
package-dir = { "" = "." }
